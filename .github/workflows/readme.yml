name: Update README stats

# Refreshes the POWER LEVEL table and the animated header line in README.md.
# Runs every 6 hours.
#
# Requires:
#   - README.md contains the STATS and TYPING marker comments
#   - Settings > Actions > General > Workflow permissions > Read and write

on:
  schedule:
    - cron: "30 */6 * * *"     # 00:30, 06:30, 12:30, 18:30 UTC  (06:00, 12:00, 18:00, 00:00 IST)
  workflow_dispatch:           # the "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/readme.yml"]

permissions:
  contents: write

concurrency:                   # never let two runs fight over the same file
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh stats in README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          cat > /tmp/update.js <<'SCRIPT_EOF'
          const fs = require("fs");
          const USER = process.env.USERNAME;
          const H = {
            Authorization: "Bearer " + process.env.GITHUB_TOKEN,
            Accept: "application/vnd.github+json",
            "User-Agent": USER + "-readme",
          };

          async function gql(query, variables) {
            const r = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: { ...H, "Content-Type": "application/json" },
              body: JSON.stringify({ query, variables }),
            });
            if (!r.ok) throw new Error("GraphQL " + r.status + ": " + (await r.text()));
            const j = await r.json();
            if (j.errors) throw new Error("GraphQL: " + JSON.stringify(j.errors));
            return j.data;
          }

          // The search API rate-limits hard; back off and retry rather than failing the run.
          async function count(q) {
            const url = "https://api.github.com/search/issues?per_page=1&q=" + encodeURIComponent(q);
            for (let i = 0; i < 4; i++) {
              const r = await fetch(url, { headers: H });
              if (r.ok) return (await r.json()).total_count;
              if ([403, 422, 429].includes(r.status)) {
                await new Promise((s) => setTimeout(s, 12000 * (i + 1)));
                continue;
              }
              throw new Error("search " + r.status + ": " + (await r.text()));
            }
            throw new Error("search kept failing: " + q);
          }

          function replaceBlock(src, tag, body) {
            const start = "<!--" + tag + ":START-->";
            const end = "<!--" + tag + ":END-->";
            const s = src.indexOf(start);
            const e = src.indexOf(end);
            if (s === -1 || e === -1 || e < s) {
              throw new Error("Missing " + tag + " markers in README.md");
            }
            return src.slice(0, s) + start + "\n" + body + "\n" + end + src.slice(e + end.length);
          }

          (async () => {
            const d = await gql(
              "query($login:String!){user(login:$login){contributionsCollection{" +
                "totalContributions " +
                "totalRepositoriesWithContributedCommits " +
                "totalRepositoriesWithContributedPullRequests " +
                "totalRepositoriesWithContributedIssues}}}",
              { login: USER }
            );

            const c = d.user.contributionsCollection;
            const contributions = c.totalContributions;
            const repos = Math.max(
              c.totalRepositoriesWithContributedCommits,
              c.totalRepositoriesWithContributedPullRequests,
              c.totalRepositoriesWithContributedIssues
            );

            const prs      = await count("author:" + USER + " type:pr");
            const merged   = await count("author:" + USER + " type:pr is:merged");
            const upstream = await count("author:" + USER + " type:pr is:merged -user:" + USER);
            const issues   = await count("author:" + USER + " type:issue");

            const stats =
              '<table>\n<tr>\n' +
              '<td align="center" width="20%"><h2>' + contributions + '</h2><sub>contributions<br/>all time</sub></td>\n' +
              '<td align="center" width="20%"><h2>' + repos + '</h2><sub>repositories<br/>contributed to</sub></td>\n' +
              '<td align="center" width="20%"><h2>' + prs + '</h2><sub>pull requests<br/>opened</sub></td>\n' +
              '<td align="center" width="20%"><h2>' + merged + '</h2><sub>merged<br/>' + upstream + ' upstream</sub></td>\n' +
              '<td align="center" width="20%"><h2>' + issues + '</h2><sub>bugs<br/>filed</sub></td>\n' +
              '</tr>\n</table>';

            // ";" separates lines for readme-typing-svg, so it must never appear inside one.
            const lines = [
              "第一話 — CHAPTER ONE: THE EXPLORER",
              "18 y/o CS + AI student. Currently shipping.",
              "I read other people's code until I find the crack.",
              "Studying ML — and debugging it in the wild.",
              merged + " merged PRs. " + issues + " bugs filed. No arc skipped.",
              '"If it\'s broken, I want to see it."',
            ].map((s) => encodeURIComponent(s.replace(/;/g, ","))).join(";");

            const typing =
              '<img src="https://readme-typing-svg.demolab.com?font=JetBrains+Mono&weight=800&size=23' +
              '&pause=1200&color=A855F7&center=true&vCenter=true&random=false&width=820&height=75' +
              '&lines=' + lines + '" alt="Typing SVG"/>';

            let readme = fs.readFileSync("README.md", "utf8");
            readme = replaceBlock(readme, "STATS", stats);
            readme = replaceBlock(readme, "TYPING", typing);
            fs.writeFileSync("README.md", readme);

            console.log(
              "contributions=%s repos=%s prs=%s merged=%s upstream=%s issues=%s",
              contributions, repos, prs, merged, upstream, issues
            );
          })().catch((e) => {
            console.error(e.message);
            process.exit(1);
          });
          SCRIPT_EOF
          node /tmp/update.js

      - name: Commit if the numbers changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh README stats"
            git push
          else
            echo "Numbers unchanged - nothing to commit."
          fi
